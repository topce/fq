name: CI

on:
  push:
    # Both filters have to be given: a workflow whose push trigger only has
    # tags/tags-ignore never runs for branch pushes at all.
    branches: ["**"]
    tags-ignore: ["v*"] # releases are handled by release.yml
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: notice toolchain and runner drift early

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build --profile release

      # Unit tests everywhere; the POSIX shell suites only where they can run
      # (see the enabled_if in test/dune).
      - name: Test
        run: opam exec -- dune runtest

      # Exercise the real code paths of the platform: enumeration and the kill
      # path, with a pid that cannot exist (the process must be reported as
      # gone, and fq must exit 0).
      - name: Smoke test the built executable
        shell: bash
        run: |
          set -eux
          exec_fq=_build/default/bin/main.exe
          "$exec_fq" --version
          "$exec_fq" --help > /dev/null
          "$exec_fq" --list > /dev/null || true
          "$exec_fq" --pid 2147483646 -y

  lint-opam:
    name: lint opam metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"

      - name: Lint opam files
        uses: ocaml/setup-ocaml/lint-opam@v3
