name: Publish to WinGet

# Submits the released Windows zip to microsoft/winget-pkgs. Needs a one-time
# manual first submission (docs/RELEASING.md) and a WINGET_TOKEN secret: a
# classic PAT with the `public_repo` scope, from the account that owns the
# winget-pkgs fork.

on:
  release:
    # `released` fires for a full release, and again when a prerelease is
    # promoted to one — never for a prerelease itself.
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.4.0"
        required: true

permissions:
  contents: read

jobs:
  winget:
    name: submit the manifest update
    runs-on: ubuntu-latest
    steps:
      - name: Is a token configured?
        id: gate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WINGET_TOKEN is not set — skipping the WinGet submission (see docs/RELEASING.md)"
          fi

      - name: Submit the update
        if: steps.gate.outputs.ready == 'true'
        # Pin to a commit for supply-chain hygiene; Dependabot keeps it fresh.
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Topce.Fq
          installers-regex: '\.zip$'
          release-tag: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          max-versions-to-keep: 10
          token: ${{ secrets.WINGET_TOKEN }}
