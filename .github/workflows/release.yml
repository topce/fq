name: Release

# Tag `vX.Y.Z` (or `vX.Y.Z-rc.1` for a canary) and this builds, tests, packages
# and publishes the release. See docs/RELEASING.md for the runbook, the
# channel publications that follow it, and how to roll back.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.4.0 (it must already exist)"
        required: true

permissions:
  contents: write # create the release and upload the artifacts
  id-token: write # provenance attestation
  attestations: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # The tag, dune-project, lib/fq.ml and the top CHANGELOG entry have to
      # agree: a release whose --version lies is worse than no release.
      - name: Check that every version says the same thing
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $TAG is not vX.Y.Z"; exit 1 ;;
          esac
          dune_version=$(sed -n 's/^(version \(.*\))$/\1/p' dune-project)
          lib_version=$(sed -n 's/^let version = "\(.*\)"$/\1/p' lib/fq.ml)
          changelog_version=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          echo "tag=$version dune-project=$dune_version lib/fq.ml=$lib_version CHANGELOG=$changelog_version"
          for found in "$dune_version" "$lib_version" "$changelog_version"; do
            if [ "$found" != "$version" ]; then
              echo "::error::version mismatch: $found is not $version"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported runner so the binary runs on any
          # distribution with a glibc at least as new (Ubuntu 22.04 = glibc 2.35).
          - os: ubuntu-22.04
            target: linux-x86_64
            archive: tar.gz
          # Best effort: fully static, for musl distributions and anywhere the
          # glibc version is a problem. Not fatal: CI builds it on every push,
          # so breakage is visible long before a release.
          - os: ubuntu-22.04
            target: linux-x86_64-static
            archive: tar.gz
            ocaml: "ocaml-variants.5.4.1+options,ocaml-option-musl,ocaml-option-static"
            best_effort: true
          - os: macos-13 # last x86_64 runner
            target: macos-x86_64
            archive: tar.gz
          - os: macos-14 # arm64
            target: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive: zip
    continue-on-error: ${{ matrix.best_effort == true }}
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml || '5' }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build --profile release

      # Never package an artifact whose tests did not pass.
      - name: Test
        run: opam exec -- dune runtest

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eux
          name="fq-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp _build/default/bin/main.exe "dist/$name/fq.exe"
          else
            cp _build/default/bin/main.exe "dist/$name/fq"
            chmod 755 "dist/$name/fq"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          (cd dist && if [ "${{ matrix.archive }}" = "zip" ]; then
             if command -v 7z > /dev/null 2>&1; then
               7z a "$name.zip" "$name" > /dev/null
             else
               powershell.exe -NoProfile -Command \
                 "Compress-Archive -Path '$name' -DestinationPath '$name.zip'"
             fi
           else
             tar -czf "$name.tar.gz" "$name"
           fi)

      # Verify the archive, not the build tree: this is what users download.
      - name: Verify the archive
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eux
          name="fq-$VERSION-${{ matrix.target }}"
          mkdir -p unpacked
          if [ "${{ matrix.archive }}" = "zip" ]; then
            if command -v 7z > /dev/null 2>&1; then
              7z x -y "dist/$name.zip" -ounpacked > /dev/null
            else
              powershell.exe -NoProfile -Command \
                "Expand-Archive -LiteralPath 'dist/$name.zip' -DestinationPath unpacked"
            fi
            "./unpacked/$name/fq.exe" --version
            "./unpacked/$name/fq.exe" --help > /dev/null
            # the kill path: a pid that cannot exist is reported as gone
            "./unpacked/$name/fq.exe" --pid 2147483646 -y
          else
            tar -xzf "dist/$name.tar.gz" -C unpacked
            "./unpacked/$name/fq" --version
            "./unpacked/$name/fq" --help > /dev/null
            # the kill path: a pid that cannot exist is reported as gone
            "./unpacked/$name/fq" --pid 2147483646 -y
          fi

      - name: Attest the provenance of the artifact
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish the GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write the checksums
        shell: bash
        run: |
          set -eux
          shopt -s nullglob
          cd dist
          files=(./*.tar.gz ./*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no release artifacts were built"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      # A tag with a suffix (v0.4.0-rc.1) publishes a prerelease: the canary
      # stage. Promote it by editing the release once the artifacts have been
      # verified on real machines (docs/RELEASING.md).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "fq $VERSION" \
            --generate-notes \
            $prerelease

      - name: Summarise
        run: |
          {
            echo "## fq $VERSION"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Next: docs/RELEASING.md — Homebrew, Scoop, WinGet, AUR."
          } >> "$GITHUB_STEP_SUMMARY"
